    purchased: true
    recycled_nonpotable: false
    label: "Municipal Potable"
    chemistry: {ph: 7.2, ec: 110, tds: 65, sio2: 3.5, na: 10, ca: 7.0, mg: 1.5,
                cl: 15, po4: 2.0, so4: 6, alkalinity: 15, cl2: 0.7,
