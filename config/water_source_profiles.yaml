# =============================================================================
# Water Source Profiles - baseline raw-water quality matrices
# =============================================================================
# Typical screening-level values compiled from standard references
# (seawater: standard mean ocean composition; potable: NYC DEP Catskill/Delaware
# supply, soft & low-alkalinity with orthophosphate corrosion control; others:
# representative literature ranges). Replace with site laboratory data for design.
#
# Units
#   pH                -
#   ec                uS/cm
#   tds, sio2, na, ca, mg, cl, po4, so4, alkalinity (as CaCO3),
#   cl2 (free chlorine), tss, bod5, cod          mg/L
#   rotavirus         organisms/L
#   giardia, cryptosporidium                     cysts or oocysts/L
#   vibrio_cholerae   CFU/L
#   e_coli            CFU/100 mL   (indicator only - not used in QMRA)
#   hpc               CFU/mL       (indicator only - not used in QMRA)
#   legionella        CFU/L
# =============================================================================

# purchased: utility tariff applies   recycled_nonpotable: counts toward LEED WE credit
sources:
