# -----------------------------------------------------------------------------
# Dose-response parameters (QMRA)
#   beta_poisson : Pd = 1 - (1 + d/beta)^(-alpha)
#   exponential  : Pd = 1 - exp(-r d)
# Rotavirus & V. cholerae values follow the EAEE 4163 course / WERF framework.
# Giardia (Rose et al. 1991), Cryptosporidium (Haas et al. 1996),
# Legionella inhalation (Armstrong & Haas 2007).
# class -> which LRV credit column applies (virus | protozoa | bacteria)
# -----------------------------------------------------------------------------
dose_response:
  rotavirus:       {model: beta_poisson, alpha: 0.253, beta: 0.422,  class: virus,    route: ingestion}
  giardia:         {model: exponential,  r: 0.0199,                  class: protozoa, route: ingestion}
  cryptosporidium: {model: exponential,  r: 0.004191,                class: protozoa, route: ingestion}
  vibrio_cholerae: {model: beta_poisson, alpha: 0.097, beta: 13020,  class: bacteria, route: ingestion}
  legionella:      {model: exponential,  r: 0.06,                    class: bacteria, route: inhalation}

# -----------------------------------------------------------------------------
# Cooling-tower recirculating water limits.
# LEED v4 BD+C WE Credit "Cooling Tower Water Use", Table 1 (max concentrations).
# ca_as_caco3 is compared against Ca(mg/L) x 2.497.
# -----------------------------------------------------------------------------
leed_condenser_limits:
  ca_as_caco3: 1000
  alkalinity: 1000
  sio2: 100
  cl: 250
  ec: 2000

silica_alert_mg_l: 150       # silica solubility blowdown alert
